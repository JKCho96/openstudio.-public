<script async src="https://www.googletagmanager.com/gtag/js?id=G-M11YH95RT9"></script>
<script>
  window.dataLayer=window.dataLayer||[];
  function gtag(){dataLayer.push(arguments);}
  gtag('js',new Date()); gtag('config','G-M11YH95RT9');
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:#fff;width:100%;overflow-x:hidden;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  #progress{position:fixed;top:0;left:0;height:4px;width:0%;z-index:100;
    background:linear-gradient(90deg,#1a73e8,#4f9bff);transition:width .08s linear;
    box-shadow:0 0 6px rgba(26,115,232,.5);}
  #wrap{position:relative;width:100%;max-width:520px;margin:0 auto;background:#fff;font-size:0;}
  #wrap img{display:block;width:100%;height:auto;margin:0;padding:0;border:0;vertical-align:top;pointer-events:none;}
  a.hot{position:absolute;display:block;z-index:5;border-radius:40px;}
  a.hot:active{background:rgba(255,255,255,.12);}
  a.hot.doc{border-radius:4px;}

  /* 희소성 바: 검정 배경 + 흰 글자 */
  #scarcity{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);
    bottom:14px;z-index:60;width:min(94%,500px);
    background:#0f0f0f;color:#fff;border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:13px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;text-decoration:none;
    box-shadow:0 10px 30px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  #scarcity.show{transform:translateX(-50%) translateY(0);}
  #scarcity .ltxt{font-weight:800;font-size:15px;letter-spacing:-.3px;line-height:1.3;color:#fff;}
  #scarcity .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:#fff;
    background:rgba(255,255,255,.14);padding:4px 9px;border-radius:8px;white-space:nowrap;}
  #scarcity:active{filter:brightness(1.3);}

  #exit{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);
    display:none;align-items:center;justify-content:center;padding:24px;}
  #exit.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  #exit .box{background:#fff;border-radius:20px;padding:30px 24px;max-width:380px;width:100%;
    text-align:center;animation:rise .3s ease;}
  @keyframes rise{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  #exit h2{font-size:23px;font-weight:900;color:#111;letter-spacing:-.5px;line-height:1.35;margin-bottom:10px;}
  #exit p{font-size:15px;color:#666;margin-bottom:22px;line-height:1.5;}
  #exit .cta{display:block;background:#1a73e8;color:#fff;text-decoration:none;
    padding:16px;border-radius:13px;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgba(26,115,232,.4);}
  #exit .cta:active{filter:brightness(.92);}
  #exit .close{display:inline-block;margin-top:14px;color:#999;font-size:13px;cursor:pointer;text-decoration:underline;}

  #stat{position:fixed;top:10px;left:8px;z-index:99;background:rgba(0,0,0,.82);color:#0f0;
    font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;display:none;}
</style>
</head>
<body>
<div id="progress"></div>
<div id="wrap">
    <img src="slices/s0.jpg" alt="" loading="eager" draggable="false">
    <img src="slices/s1.jpg" alt="" loading="eager" draggable="false">
    <img src="slices/s2.jpg" alt="" loading="lazy" draggable="false">
    <img src="slices/s3.jpg" alt="" loading="lazy" draggable="false">
    <img src="slices/s4.jpg" alt="" loading="lazy" draggable="false">
    <img src="slices/s5.jpg" alt="" loading="lazy" draggable="false">
    <img src="slices/s6.jpg" alt="" loading="lazy" draggable="false">

    <a class="hot" data-btn="1" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:13.993%;top:2.392%;width:45.813%;height:1.600%;"></a>
    <a class="hot" data-btn="2" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:13.093%;top:20.518%;width:45.748%;height:1.600%;"></a>
    <a class="hot" data-btn="3" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:13.463%;top:33.276%;width:45.748%;height:1.600%;"></a>
    <a class="hot" data-btn="4" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:13.927%;top:60.646%;width:52.613%;height:1.600%;"></a>
    <a class="hot" data-btn="5" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:13.093%;top:74.839%;width:52.624%;height:1.600%;"></a>
    <a class="hot" data-btn="6" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:14.307%;top:89.002%;width:45.748%;height:1.600%;"></a>
    <a class="hot" data-btn="7" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" style="left:14.005%;top:92.751%;width:52.109%;height:1.600%;"></a>
    <a class="hot doc" href="https://docs.google.com/document/d/1H8NK_R-rxtPStTwa0Hrw2CKyhCZ7DG4rsNfD9AhiA8E/edit?usp=sharing" target="_blank" rel="noopener" style="left:83.827%;top:97.188%;width:9.638%;height:0.900%;"></a>
    <a class="hot doc" href="https://docs.google.com/document/d/1H8NK_R-rxtPStTwa0Hrw2CKyhCZ7DG4rsNfD9AhiA8E/edit?usp=sharing" target="_blank" rel="noopener" style="left:7.315%;top:97.396%;width:9.638%;height:0.900%;"></a>

</div>

<a id="scarcity" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" data-btn="scarcity">
  <span class="ltxt">선착순 마감<br>5팀 남았습니다</span>
  <span class="timer" id="timer">00:00:00</span>
</a>

<div id="exit">
  <div class="box">
    <h2>지금 쇼츠하셔야 합니다</h2>
    <p>경쟁사는 이미 하고 있습니다</p>
    <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLScCT0CoZv_lluhzOsr49VZ8wL_xm562016lbAtMAc4zrlulLA/viewform?usp=dialog" target="_blank" rel="noopener" data-btn="exit">3분이면 문의 끝</a>
    <span class="close" id="exitClose">괜찮습니다, 닫기</span>
  </div>
</div>

<div id="stat"></div>
<script>
(function(){
  function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var S=load('os_stats',{visits:0,clicks:0,maxDepth:0,btnClicks:{}});
  S.visits++; save('os_stats',S);

  var bar=document.getElementById('progress');
  var scarcity=document.getElementById('scarcity');
  var shownScarcity=false;
  function onScroll(){
    var max=document.body.scrollHeight-window.innerHeight;
    var pct=max>0?Math.min(100,window.scrollY/max*100):0;
    bar.style.width=pct+'%';
    var d=Math.round(pct);
    if(d>S.maxDepth){S.maxDepth=d;save('os_stats',S);}
    if(window.gtag&&d%25===0&&d>0){gtag('event','scroll_depth',{percent:d});}
    if(!shownScarcity && pct>=55){ shownScarcity=true; scarcity.classList.add('show');
      if(window.gtag){gtag('event','scarcity_shown');} }
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  var DUR=30*60*1000;
  var start=load('os_timer_start',null);
  if(!start){ start=Date.now(); save('os_timer_start',start); }
  var tEl=document.getElementById('timer');
  function tick(){
    var left=Math.max(0, start+DUR-Date.now());
    var h=Math.floor(left/3600000), m=Math.floor(left%3600000/60000), s=Math.floor(left%60000/1000);
    function z(n){return(n<10?'0':'')+n;}
    tEl.textContent=z(h)+':'+z(m)+':'+z(s);
  }
  tick(); setInterval(tick,1000);

  document.querySelectorAll('[data-btn]').forEach(function(a){
    a.addEventListener('click',function(){var id=a.getAttribute('data-btn');
      S.clicks++;S.btnClicks[id]=(S.btnClicks[id]||0)+1;save('os_stats',S);
      if(window.gtag){gtag('event','cta_click',{button:id});}});});

  var exitEl=document.getElementById('exit');
  var exitDone=false;
  function fireExit(){ if(exitDone)return; exitDone=true; exitEl.classList.add('show');
    if(window.gtag){gtag('event','exit_popup_shown');} }
  document.getElementById('exitClose').addEventListener('click',function(){exitEl.classList.remove('show');});
  exitEl.addEventListener('click',function(e){if(e.target===exitEl)exitEl.classList.remove('show');});
  var lastY=window.scrollY, lastT=Date.now();
  window.addEventListener('scroll',function(){
    var y=window.scrollY, t=Date.now(), dy=lastY-y, dt=t-lastT||1; var v=dy/dt;
    if(v>1.5 && y<document.body.scrollHeight*0.6 && S.maxDepth>20){ fireExit(); }
    lastY=y; lastT=t;
  },{passive:true});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden && S.maxDepth>20){ fireExit(); } });
  history.pushState(null,'',location.href);
  window.addEventListener('popstate',function(){ fireExit(); history.pushState(null,'',location.href); });

  if(location.search.indexOf('stats=1')>-1){var el=document.getElementById('stat');el.style.display='block';
    setInterval(function(){var s=load('os_stats',S);
      el.innerHTML='visits '+s.visits+'<br>clicks '+s.clicks+'<br>depth '+s.maxDepth+'%<br>btn '+JSON.stringify(s.btnClicks);},500);}
})();
</script>
</body>
</html>
